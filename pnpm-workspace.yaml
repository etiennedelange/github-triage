# Supply-chain hardening
# Transitive deps may only come from the registry (no git:, file: or tarball URLs).
blockExoticSubdeps: true
# An install script that isn't approved in allowBuilds fails the install instead of being skipped.
strictDepBuilds: true
# Don't install versions published in the last 24 hours (minutes); most malicious releases are pulled within hours.
minimumReleaseAge: 1440
# Refuse a version published with weaker trust evidence (e.g. lost provenance) than earlier ones: the sign of a hijacked account.
trustPolicy: no-downgrade
# Maintenance releases on older version lines, published by their usual maintainers before
# those lines had provenance. pnpm reads the missing provenance as a downgrade; it isn't one.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20260926.0-alpha
  - wrangler@4.142.0
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Advisories `pnpm audit` (audit.yml) should skip. Each needs a reason, and goes once it's fixed.
auditConfig:
  ignoreGhsas:
    # zod 3.x memory exhaustion (fixed only in 4.6.6). The only zod 3 copy is the shadcn CLI's
    # MCP server (shadcn > @modelcontextprotocol/sdk); the app imports just shadcn's CSS.
    - GHSA-mrhx-c7xc-m3w5
