    <title>GitHub Triage</title>
    <!-- Apply the saved ground before first paint: Snow Storm (light) or Nord (dark). -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.ground = dark ? "nord" : "snow-storm";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
